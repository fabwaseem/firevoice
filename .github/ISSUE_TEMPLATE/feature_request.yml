name: Feature request
description: An idea for FireVoice
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not the solution yet. "I record a weekly podcast and ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working in FireVoice.
    validations:
      required: true
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: Workarounds you use today, other apps that do it well, screenshots.
