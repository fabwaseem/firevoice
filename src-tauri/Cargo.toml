[package]
name = "firevoice-desktop"
version = "1.9.0"
description = "FireVoice desktop studio"
authors = ["Waseem Anjum"]
license-file = "../LICENSE"
publish = false
edition = "2024"
rust-version = "1.90"

[lib]
name = "firevoice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
cpal = "0.18.2"
enigo = "0.6.1"
arboard = { version = "3.7.0", default-features = false }
futures-util = "0.3.34"
tauri-plugin-global-shortcut = "2.4.1"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
tokio-tungstenite = "0.30.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation"] }
